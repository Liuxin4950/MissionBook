name: mission_book
description: "AI-assisted planning, execution, evidence, evaluation, and replanning MVP."
publish_to: 'none'

version: 0.2.22+2024

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 现有通知 Web 插件的生成注册代码依赖此 SDK 库，插件自身未声明它。
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  archive: ^4.5.2
  crypto: 3.0.7
  drift: 2.34.0
  drift_flutter: ^0.3.1
  agent_core:
    path: packages/agent_core
  flutter_secure_storage: ^9.2.4
  uuid: ^4.6.0
  # Windows 使用官方实现；Android 通过应用自身的系统 ACTION_OPEN_DOCUMENT
  # 通道选择文件，避免插件子工程重复下载另一套 Android Gradle Plugin。
  file_selector_platform_interface: 2.7.0
  file_selector_windows: 0.9.3+6
  path_provider: 2.1.6
  # 浏览器图片使用自己的 OPFS 持久目录，不把附件只留在内存里。
  web: 1.1.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  camera: 0.12.0+2
  flutter_markdown_plus: 1.0.12
  markdown: 7.3.1
  url_launcher: ^6.3.3
  record: 6.2.0
  http: 1.6.0
  http_parser: 4.1.2
  sherpa_onnx: 1.13.8
  html: ^0.15.7
  image: 4.12.0
  sqlite3: 3.8.0

dev_dependencies:
  camera_platform_interface: 2.15.0 # 相机面板通过官方平台接口验证权限与生命周期。
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:

  uses-material-design: true
  assets:
    - assets/branding/mission_book_logo_v4.png
    - assets/branding/shuqi-avatar.png
    - assets/illustrations/journey-garden-v2.png
    - assets/illustrations/goal-waymarker.png
    - assets/illustrations/goal-path.png
    - assets/illustrations/day-plan.png
    - assets/illustrations/assistant-notebook.png
    - assets/illustrations/memory-notebook.png
    - assets/illustrations/history-pages.png
    - assets/illustrations/profile-paper-background.png
    - assets/illustrations/paper-leaf-background.png
    - assets/illustrations/profile-notebook.png
    - assets/illustrations/settings-notebook.png
    - assets/illustrations/focus-hourglass.png
    - assets/models/sensevoice/LICENSE
    - assets/models/sensevoice/test_zh.wav
