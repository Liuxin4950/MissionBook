</div>
<style>
#mb-execution-current{--ex-bg:#F7F8F2;--ex-primary:#244D3D;--ex-accent:#D7F57B;--ex-soft:#E8EDE4;--ex-ink:#233B30;--ex-muted:#617067;--ex-line:#DCE3D8;--ex-white:#FFFFFF;color:var(--ex-ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;color-scheme:light;padding:0}
#mb-execution-current *{box-sizing:border-box}#mb-execution-current [hidden]{display:none!important}#mb-execution-current button,#mb-execution-current input,#mb-execution-current textarea{font:inherit;color:inherit}#mb-execution-current button{border:0;background:transparent;margin:0;padding:0}#mb-execution-current button:focus-visible,#mb-execution-current input:focus-visible,#mb-execution-current textarea:focus-visible{outline:3px solid var(--ex-primary);outline-offset:3px}
#mb-execution-current .ex-phone{position:relative;width:100%;max-width:390px;height:844px;margin:auto;overflow:hidden;background:var(--ex-bg)}#mb-execution-current .ex-status{height:38px;padding:12px 24px 0;display:flex;justify-content:space-between;font-size:14px;line-height:20px;font-weight:600;font-variant-numeric:tabular-nums}#mb-execution-current .ex-status>span:last-child{display:flex;gap:5px}#mb-execution-current .ex-status svg{width:15px;height:15px}
#mb-execution-current .ex-appbar{height:56px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;font-size:16px;line-height:24px;font-weight:500}#mb-execution-current .ex-appbar>svg{width:22px;height:22px}#mb-execution-current .ex-back{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:var(--ex-white);background:var(--ex-primary)}#mb-execution-current .ex-back svg{width:22px;height:22px}
#mb-execution-current .ex-body{position:absolute;inset:94px 0 112px;overflow:auto;padding:16px 24px;scrollbar-width:thin;scrollbar-color:var(--ex-line) transparent}#mb-execution-current .ex-identity{display:flex;align-items:center;justify-content:space-between;gap:10px}#mb-execution-current h1{font-size:18px;line-height:24px;font-weight:600;margin:0;overflow-wrap:anywhere;min-width:0}#mb-execution-current [data-phase]{font-size:14px;line-height:20px;white-space:nowrap;padding:5px 10px;border-radius:18px;background:var(--ex-accent);color:var(--ex-primary)}#mb-execution-current[data-paused] [data-phase]{background:var(--ex-soft)}#mb-execution-current .ex-path{font-size:14px;line-height:20px;color:var(--ex-muted);margin:8px 0 0}
#mb-execution-current .ex-meter{position:relative;width:min(260px,100%);aspect-ratio:1;margin:20px auto 12px}#mb-execution-current .ex-meter>svg{display:block;width:100%;height:100%;overflow:visible}#mb-execution-current .ex-track,#mb-execution-current .ex-arc{fill:none;stroke-width:12;stroke-linecap:round}#mb-execution-current .ex-track{stroke:var(--ex-soft)}#mb-execution-current .ex-arc{stroke:var(--ex-primary)}#mb-execution-current .ex-dot{fill:var(--ex-accent);transform-box:view-box;transform-origin:50% 50%}#mb-execution-current[data-ready] .ex-arc{transition:stroke-dashoffset 360ms cubic-bezier(.22,.8,.24,1)}#mb-execution-current[data-ready] .ex-dot{transition:transform 360ms cubic-bezier(.22,.8,.24,1)}
#mb-execution-current .ex-meter-copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none;font-size:14px;line-height:20px;color:var(--ex-muted)}#mb-execution-current [data-focus]{font-size:48px;line-height:56px;font-weight:500;color:var(--ex-ink);font-variant-numeric:tabular-nums;letter-spacing:-1.5px}#mb-execution-current .ex-budget-summary{font-size:14px;line-height:20px;text-align:center;color:var(--ex-muted);margin:0;font-variant-numeric:tabular-nums}#mb-execution-current .ex-extend-toggle{display:block;min-height:48px;margin:auto;font-size:14px;line-height:20px;color:var(--ex-primary)}
#mb-execution-current #ex-extend{margin:4px 0 16px;padding:12px 16px;border-radius:20px;background:var(--ex-soft)}#mb-execution-current #ex-extend label{display:block;font-size:14px;line-height:20px;margin-bottom:8px}#mb-execution-current #ex-extend>div{display:flex;gap:12px}#mb-execution-current #ex-extend input{width:100px;min-width:0;height:48px;border:1px solid var(--ex-muted);border-radius:16px;padding:8px 12px;background:var(--ex-white);font-size:18px;line-height:24px}#mb-execution-current #ex-extend button{flex:1;min-height:48px;background:var(--ex-primary);color:var(--ex-white);border-radius:24px;font-size:14px;line-height:20px}#mb-execution-current #ex-extend button:disabled{opacity:.5}
#mb-execution-current .ex-plan-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;min-height:72px;width:100%;padding:12px 16px;border-radius:24px;background:var(--ex-soft);font-size:14px;line-height:20px}#mb-execution-current .ex-plan-toggle>span{display:flex;flex-direction:column;gap:6px}#mb-execution-current .ex-plan-toggle small{font-size:14px;line-height:20px;color:var(--ex-muted)}#mb-execution-current .ex-plan-toggle>svg{width:18px;height:18px;flex-shrink:0}#mb-execution-current #ex-plan{padding:8px 16px;font-size:14px;line-height:22px;color:var(--ex-muted)}#mb-execution-current #ex-plan ol{padding-left:20px;margin:4px 0}#mb-execution-current #ex-plan p{margin:8px 0}
#mb-execution-current .ex-note-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;margin-top:12px;color:var(--ex-muted);font-size:14px;line-height:20px}#mb-execution-current .ex-note-toggle svg{width:18px;height:18px}#mb-execution-current #ex-note{display:block;width:100%;padding:12px;border:1px solid var(--ex-muted);border-radius:16px;font-size:18px;line-height:24px;background:var(--ex-white)}
#mb-execution-current .ex-actions{position:absolute;bottom:40px;left:24px;right:24px;display:flex;gap:12px}#mb-execution-current .ex-actions>button,#mb-execution-current .ex-actions>.ex-end{display:flex;align-items:center;justify-content:center;gap:10px;flex:1;min-height:52px;border-radius:28px;font-size:16px;line-height:24px;font-weight:600}#mb-execution-current .ex-actions>.ex-pause{color:var(--ex-white);background:var(--ex-primary)}#mb-execution-current [data-pause-symbol]{font-size:24px;line-height:24px}#mb-execution-current .ex-actions>.ex-end{border:1px solid var(--ex-muted);background:var(--ex-soft);color:var(--ex-ink)}#mb-execution-current .ex-end svg{width:18px;height:18px}#mb-execution-current .ex-home{position:absolute;bottom:8px;left:calc(50% - 48px);width:96px;height:4px;border-radius:4px;background:var(--ex-ink)}
#mb-execution-current .ex-preview{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:16px;font-size:12px;line-height:18px;color:var(--ex-muted)}#mb-execution-current .ex-preview button{padding:10px 14px;min-height:44px;border-radius:24px;background:var(--ex-soft)}
@media(max-width:340px){#mb-execution-current .ex-phone{height:568px}#mb-execution-current .ex-status,#mb-execution-current .ex-appbar{padding-left:16px;padding-right:16px}#mb-execution-current .ex-body{padding-left:16px;padding-right:16px}#mb-execution-current .ex-actions{left:16px;right:16px}}
@media(prefers-reduced-motion:reduce){#mb-execution-current:not([data-motion]) .ex-arc,#mb-execution-current:not([data-motion]) .ex-dot{transition:none}}
#mb-execution-current .ex-plan-toggle small,#mb-execution-current .ex-preview button{color:var(--ex-primary)}
#mb-execution-current .ex-extend-toggle,#mb-execution-current #ex-extend button,#mb-execution-current .ex-plan-toggle,#mb-execution-current .ex-note-toggle{font-size:16px;line-height:24px}
</style>
<script>
(()=>{
 const root=document.getElementById('mb-execution-current'),arc=root.querySelector('.ex-arc'),dot=root.querySelector('.ex-dot'),input=root.querySelector('#ex-minutes'),form=root.querySelector('#ex-extend');
 const circumference=2*Math.PI*126;let phase='RUNNING',base=1902,extra=0,focusStart=null,elapsedStart=null;
 const focus=()=>base+(phase==='RUNNING'&&focusStart!==null?(performance.now()-focusStart)/1000:0);
 const format=value=>{const n=Math.floor(Math.max(0,value));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};
 function render(){const f=focus(),budget=(45+extra)*60,ratio=Math.min(f/budget,1);arc.style.strokeDasharray=circumference+' '+circumference;arc.style.strokeDashoffset=String(circumference*(1-ratio));dot.style.transform='rotate('+ratio*360+'deg)';root.querySelector('[data-focus]').textContent=format(f);root.querySelector('[data-budget]').textContent='当前额度'+(45+extra)+'分';root.querySelector('[data-summary]').textContent='原计划45分 · 已增加'+extra+'分';root.querySelector('[data-phase]').textContent=phase==='RUNNING'?'执行中':'已暂停';root.toggleAttribute('data-paused',phase==='PAUSED');root.querySelector('[data-pause-label]').textContent=phase==='RUNNING'?'暂停':'继续';root.querySelector('[data-pause-symbol]').textContent=phase==='RUNNING'?'Ⅱ':'▷';root.querySelector('.ex-meter').setAttribute('aria-label','专注'+format(f)+'，当前额度'+(45+extra)+'分，用时比例'+(f/budget*100).toFixed(2)+'%');root.dataset.focusSeconds=f.toFixed(3);root.dataset.budgetSeconds=String(budget);root.dataset.phase=phase;if(elapsedStart!==null){const t=14*3600+36*60+42+Math.floor((performance.now()-elapsedStart)/1000);root.querySelector('[data-clock]').textContent=String(Math.floor(t/3600)%24).padStart(2,'0')+':'+String(Math.floor(t/60)%60).padStart(2,'0');}}
 function activate(){const now=performance.now();if(elapsedStart===null)elapsedStart=now;if(phase==='RUNNING'&&focusStart===null)focusStart=now;render();}
 root.querySelector('[data-run]').addEventListener('click',activate);
 root.querySelector('.ex-pause').addEventListener('click',()=>{if(phase==='RUNNING'){base=focus();focusStart=null;phase='PAUSED';}else{phase='RUNNING';activate();}render();});
 for(const [buttonName,targetId] of [['.ex-extend-toggle','ex-extend'],['.ex-plan-toggle','ex-plan'],['.ex-note-toggle','ex-note']])root.querySelector(buttonName).addEventListener('click',event=>{const button=event.currentTarget,open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));root.querySelector('#'+targetId).hidden=!open;});
 input.addEventListener('input',()=>{form.querySelector('button').disabled=!(Number.isSafeInteger(Number(input.value))&&Number(input.value)>0);});
 const extend=()=>{const value=Number(input.value);if(!Number.isSafeInteger(value)||value<=0)return;extra+=value;form.hidden=true;root.querySelector('.ex-extend-toggle').setAttribute('aria-expanded','false');render();};form.querySelector('button').addEventListener('click',extend);form.addEventListener('submit',event=>event.preventDefault());input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();extend();}});
 root.querySelector('[data-reset]').addEventListener('click',()=>{phase='RUNNING';base=1902;extra=0;focusStart=null;elapsedStart=null;root.querySelector('[data-clock]').textContent='14:36';for(const [buttonName,targetId] of [['.ex-extend-toggle','ex-extend'],['.ex-plan-toggle','ex-plan'],['.ex-note-toggle','ex-note']]){root.querySelector(buttonName).setAttribute('aria-expanded','false');root.querySelector('#'+targetId).hidden=true;}input.value='15';form.querySelector('button').disabled=false;root.querySelector('#ex-note').value='';render();});
 root.querySelector('[data-motion]').addEventListener('click',event=>{const on=event.currentTarget.getAttribute('aria-pressed')!=='true';event.currentTarget.setAttribute('aria-pressed',String(on));root.toggleAttribute('data-motion',on);});
 render();requestAnimationFrame(()=>root.setAttribute('data-ready',''));setInterval(()=>{if(elapsedStart!==null)render();},1000);
})();
</script>
