# 静态分析与 lint 配置；命令行执行 flutter analyze --fatal-infos。
analyzer:
  # 与 packages/agent_core 对齐：禁止隐式类型转换、推断失败和裸泛型，
  # 让 dynamic 只出现在明确的 JSON/平台边界，而不是悄悄扩散到业务代码。
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - output/**
    - coverage/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # 资源释放与异步结果必须显式处理，避免页面销毁后仍回调或任务被静默吞掉。
    always_declare_return_types: true
    cancel_subscriptions: true
    close_sinks: true
    unawaited_futures: true
